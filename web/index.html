<script type="text/babel" data-type="module" data-presets="react">
import React, { useState, useEffect, useCallback } from "react";
import { createRoot } from "react-dom/client";
import {
  MessageSquare,
  MessageSquarePlus,
  BarChart3,
  Star,
  ChevronDown,
  ChevronUp,
  CheckCircle2,
  Send,
  Sparkles,
} from "lucide-react";

/* =========================================================================
   REAL DATA LAYER
   Everything below fetches from api.py, which reads the actual pipeline
   artifacts (themes.json, insights.json, communities.json, units.jsonl,
   embeddings.npy) - no mock data. /api/ask runs live local semantic search
   then synthesizes a short prose answer via Groq from the matching reviews.
   (sentence-transformers/all-MiniLM-L6-v2, the same model Stage 4 uses).
   ========================================================================= */

const API_BASE = "/api";

const RESEARCH_QUESTIONS = [
  "Why do users repeatedly buy from the same categories?",
  "What prevents users from exploring new categories?",
  "How do users discover products today?",
  "What role do habits play in shopping behavior?",
  "What information do users need before trying a new category?",
  "What frustrations emerge repeatedly?",
  "Which user segments are more likely to experiment?",
  "What unmet needs emerge consistently across discussions?",
];

const INTRO_MESSAGE = {
  id: "intro",
  role: "assistant",
  text: "Ask me anything about what Blinkit Cx thinks. Every answer is grounded with real reviews and cited by source.",
  citations: [],
};

async function apiGet(path) {
  const res = await fetch(API_BASE + path);
  if (!res.ok) throw new Error(`${path} -> HTTP ${res.status}`);
  return res.json();
}

async function apiAsk(query) {
  const res = await fetch(API_BASE + "/ask", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query }),
  });
  if (!res.ok) throw new Error(`/ask -> HTTP ${res.status}`);
  return res.json();
}

const STOPWORDS = new Set(["the", "a", "an", "is", "are", "do", "does", "did", "why", "what", "how", "who", "which", "users", "user", "people", "say", "says", "said", "about", "on", "in", "to", "of", "for", "and", "or", "with", "that", "this", "my", "you", "your", "it", "its", "them", "they", "their", "from", "have", "has", "had", "be", "been", "being", "as", "at", "by", "not", "but", "so", "if", "can", "could", "would", "should", "will", "just", "get", "gets", "getting"]);

function tokenize(str) {
  const raw = (str || "").toLowerCase().match(/[a-z']+/g) || [];
  return raw.filter((t) => t.length > 2 && !STOPWORDS.has(t));
}

/** Replace em/en dashes in any UI-facing copy. */
function noEmDash(text) {
  if (text == null) return text;
  return String(text).replace(/[\u2014\u2013—–]/g, "-");
}

/* ============================= UI PIECES ============================= */

function StarRow({ rating }) {
  const r = rating || 0;
  return (
    <span className="stars" aria-label={r + " out of 5 stars"}>
      {[1, 2, 3, 4, 5].map((i) => (
        <Star key={i} size={12} className={i <= r ? "star-on" : "star-off"} fill={i <= r ? "currentColor" : "none"} />
      ))}
    </span>
  );
}

function highlightText(text, tokens) {
  if (!tokens || tokens.length === 0) return text;
  const uniq = Array.from(new Set(tokens.filter((t) => t.length > 2))).sort((a, b) => b.length - a.length);
  if (uniq.length === 0) return text;
  const escaped = uniq.map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  const pattern = new RegExp("(" + escaped.join("|") + ")", "gi");
  const parts = text.split(pattern);
  return parts.map((part, i) =>
    uniq.some((t) => t.toLowerCase() === part.toLowerCase()) ? (
      <mark className="hl" key={i}>{part}</mark>
    ) : (
      <React.Fragment key={i}>{part}</React.Fragment>
    )
  );
}

function formatDate(iso) {
  if (!iso) return "-";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  return d.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
}

function CitationChit({ review, sentiment, matched, index }) {
  const sourceKey = review.source === "mouthshut" ? "mouthshut" : "google_play";
  const sourceLabel = sourceKey === "mouthshut" ? "Mouthshut" : "Google Play";
  return (
    <div className={"chit sentiment-" + (sentiment || "pattern")}>
      <div className="chit-strip" />
      <div className="chit-body">
        <div className="chit-top">
          <span className="chit-cite mono">[{index}]</span>
          <StarRow rating={review.rating} />
        </div>
        <div className="chit-seam">
          <span className="notch notch-l" />
          <span className="notch notch-r" />
        </div>
        <p className="chit-text">{highlightText(noEmDash(review.text), matched)}</p>
        <div className="chit-bottom">
          <div className="chit-bottom-left">
            <span className={"chit-source-tag mono source-" + sourceKey}>{sourceLabel}</span>
            {review.theme_label ? <span className="chit-theme">{review.theme_label}</span> : null}
          </div>
          <span className="chit-date">{formatDate(review.date)}</span>
        </div>
      </div>
    </div>
  );
}

/* ============================== APP ============================== */

function App() {
  const [tab, setTab] = useState("ask");
  const [overview, setOverview] = useState(null);
  const [themes, setThemes] = useState([]);
  const [topThemes, setTopThemes] = useState([]);
  const [nearMisses, setNearMisses] = useState([]);
  const [quotesOpen, setQuotesOpen] = useState({});
  const [loadError, setLoadError] = useState(null);
  const [ready, setReady] = useState(false);

  const [messages, setMessages] = useState([INTRO_MESSAGE]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [selectedTheme, setSelectedTheme] = useState(null);
  const [expanded, setExpanded] = useState({});
  const [themeCitations, setThemeCitations] = useState({});
  const [citationsLoading, setCitationsLoading] = useState({});

  useEffect(() => {
    Promise.all([apiGet("/overview"), apiGet("/themes"), apiGet("/questions"), apiGet("/top-themes")])
      .then(([ov, th, qs, tt]) => {
        setOverview(ov);
        setThemes(th);
        setTopThemes((tt && tt.themes) || []);
        setNearMisses((tt && tt.near_misses) || []);
        setReady(true);
      })
      .catch((err) => setLoadError(String(err)));
  }, []);

  const sentimentById = React.useMemo(() => {
    const m = {};
    themes.forEach((t) => (m[t.id] = t.sentiment));
    return m;
  }, [themes]);

  function handleNewChat() {
    if (loading) return;
    setMessages([{ ...INTRO_MESSAGE, id: "intro-" + Date.now() }]);
    setInput("");
  }

  function handleSend(text) {
    const q = (text !== undefined ? text : input).trim();
    if (!q || loading) return;
    const tokens = tokenize(q);
    setMessages((prev) => [...prev, { id: Date.now(), role: "user", text: q, citations: [] }]);
    setInput("");
    setLoading(true);
    apiAsk(q)
      .then((result) => {
        setMessages((prev) => [
          ...prev,
          {
            id: Date.now() + 1,
            role: "assistant",
            text: result.text,
            citations: (result.citations || []).map((c) => ({ ...c, queryTokens: tokens })),
          },
        ]);
      })
      .catch((err) => {
        setMessages((prev) => [
          ...prev,
          {
            id: Date.now() + 1,
            role: "assistant",
            text: "Something went wrong reaching the search backend: " + String(err),
            citations: [],
            error: true,
          },
        ]);
      })
      .finally(() => setLoading(false));
  }

  const toggleExpand = useCallback(
    (id) => {
      setExpanded((prev) => ({ ...prev, [id]: !prev[id] }));
      if (!themeCitations[id] && !citationsLoading[id]) {
        setCitationsLoading((prev) => ({ ...prev, [id]: true }));
        apiGet(`/themes/${encodeURIComponent(id)}/citations?limit=3`)
          .then((data) => setThemeCitations((prev) => ({ ...prev, [id]: data })))
          .catch(() => setThemeCitations((prev) => ({ ...prev, [id]: [] })))
          .finally(() => setCitationsLoading((prev) => ({ ...prev, [id]: false })));
      }
    },
    [themeCitations, citationsLoading]
  );

  const maxCount = themes.length ? Math.max(...themes.map((t) => t.count)) : 1;
  const maxShare = topThemes.length ? Math.max(...topThemes.map((t) => t.share_pct)) : 1;
  const sourceLabel = overview && overview.source_distribution
    ? Object.keys(overview.source_distribution).map((s) => (s === "mouthshut" ? "Mouthshut" : "Google Play")).join(" + ")
    : "-";
  const dateRangeLabel = (() => {
    if (!overview || (!overview.date_min && !overview.date_max)) return "-";
    const fmt = (iso) => {
      if (!iso) return null;
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return iso.slice(0, 10);
      return d.toLocaleDateString("en-IN", { month: "short", year: "numeric" });
    };
    const a = fmt(overview.date_min);
    const b = fmt(overview.date_max);
    if (a && b) return a + " to " + b;
    return a || b || "-";
  })();
  const pipelineStats = overview?.pipeline_stats || {};
  const scrapedCount = pipelineStats.scraped || 0;
  const cleanedCount = pipelineStats.cleaned || 0;
  const inEngineCount = pipelineStats.in_engine || 0;
  const relevantCount = pipelineStats.relevant || 0;
  const pct = (num, den) => den > 0 ? Math.round((num / den) * 100) : 0;
  
  const sourceDist = overview?.source_distribution || {};
  const gpCount = sourceDist.google_play || 0;
  const msCount = sourceDist.mouthshut || 0;
  const totalInEngineSource = gpCount + msCount;
  const gpPct = pct(gpCount, totalInEngineSource);
  const msPct = pct(msCount, totalInEngineSource);

  const relevanceLabel =
    overview && overview.relevance_pct != null ? overview.relevance_pct + "%" : "-";

  if (loadError) {
    return (
      <div className="dq-root">
        <div className="dq-error-screen">
          <strong>Couldn't load the Discovery Engine data.</strong>
          <span>{loadError}</span>
          <span>Make sure the pipeline has been run (`python -m src.pipeline`) and api.py is serving this page.</span>
        </div>
      </div>
    );
  }

  if (!ready) {
    return (
      <div className="dq-root">
        <div className="dq-loading-screen">
          <Sparkles size={22} />
          <span>Loading real corpus data…</span>
        </div>
      </div>
    );
  }

  return (
    <div className="dq-root">
      <div className="dq-header">
        <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
          <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Blinkit-yellow-app-icon.svg" width="24" height="24" alt="Blinkit" style={{ borderRadius: "6px" }} />
          <p className="dq-title-eyebrow mono">AI Discovery Engine · Blinkit</p>
        </div>
        {overview ? (
          <div className="dq-funnel-container">
            <div className="dq-funnel mono">
              <div className="dq-funnel-stage" title="raw reviews collected">
                <span className="dq-funnel-label">SCRAPED ⓘ</span>
                <span className="dq-funnel-val">{scrapedCount.toLocaleString()}</span>
              </div>
              <span className="dq-funnel-arrow">→</span>
              <div className="dq-funnel-stage" title="after normalization + rule-based filtering (dedupe, empty, junk)">
                <span className="dq-funnel-label">CLEANED ⓘ</span>
                <span className="dq-funnel-val">{cleanedCount.toLocaleString()} <span className="dq-funnel-sub">({pct(cleanedCount, scrapedCount)}%)</span></span>
              </div>
              <span className="dq-funnel-arrow">→</span>
              <div className="dq-funnel-stage" title="final embedded/clustered corpus">
                <span className="dq-funnel-label">IN ENGINE ⓘ</span>
                <span className="dq-funnel-val">{inEngineCount.toLocaleString()} <span className="dq-funnel-sub">({pct(inEngineCount, cleanedCount)}%)</span></span>
              </div>
              <span className="dq-funnel-arrow">→</span>
              <div className="dq-funnel-stage" title="matched research scope">
                <span className="dq-funnel-label">RELEVANT ⓘ</span>
                <span className="dq-funnel-val">{relevantCount.toLocaleString()} <span className="dq-funnel-sub">({pct(relevantCount, inEngineCount)}%)</span></span>
              </div>
            </div>
            <div className="dq-funnel-sub" style={{ display: "flex", alignItems: "center", gap: "8px", justifyContent: "center" }}>
              <span style={{ display: "flex", alignItems: "center", gap: "4px" }}>
                <img src="https://cdn.simpleicons.org/googleplay/414141" width="14" height="14" alt="Google Play" />
                Google Play: <strong>{gpCount.toLocaleString()}</strong> ({gpPct}%)
              </span>
              &middot;
              <span style={{ display: "flex", alignItems: "center", gap: "4px" }}>
                <img src="https://www.mouthshut.com/favicon.ico" width="14" height="14" alt="MouthShut" style={{ borderRadius: "2px" }} />
                MouthShut: <strong>{msCount.toLocaleString()}</strong> ({msPct}%)
              </span>
              &middot; {dateRangeLabel}
            </div>
          </div>
        ) : null}
      </div>

      <div className="dq-tabs dq-tabs-underline">
        <button className={"dq-tab" + (tab === "ask" ? " active" : "")} onClick={() => setTab("ask")}>
          <MessageSquare size={15} /> Ask
        </button>
        <button className={"dq-tab" + (tab === "narrative" ? " active" : "")} onClick={() => setTab("narrative")}>
          <BarChart3 size={15} /> Narrative
        </button>
      </div>

      <div className="dq-body">
        {tab === "ask" && (
          <div className="ask-layout">
            <div className="chat-panel">
              <div className="chat-scroll">
                {messages.map((m) => (
                  <div key={m.id} className={"msg-row " + m.role}>
                    {m.role === "user" ? (
                      <div className="msg-bubble-user">{noEmDash(m.text)}</div>
                    ) : (
                      <div className="msg-assistant">
                        <div className="assistant-head">
                          <Sparkles size={13} />
                          <span className="mono">Discovery Engine</span>
                        </div>
                        <div className={"msg-text" + (m.error ? " msg-error" : "")}>{noEmDash(m.text)}</div>
                        {m.citations.length > 0 && (
                          <>
                            <p className="citations-label mono">Supporting reviews ({m.citations.length})</p>
                            <div className="citations-row">
                              {m.citations.map((c, i) => (
                                <CitationChit key={c.id} index={i + 1} review={c} sentiment={sentimentById[c.theme_id]} matched={c.queryTokens} />
                              ))}
                            </div>
                          </>
                        )}
                      </div>
                    )}
                  </div>
                ))}
                {loading && (
                  <div className="loading-row mono">
                    <span className="pulse-dot" /> Embedding query & scanning {overview.num_units.toLocaleString()} review units…
                  </div>
                )}
              </div>
              <div className="chat-input-row">
                <input
                  className="chat-input"
                  value={input}
                  placeholder="Ask a question about the review dataset…"
                  onChange={(e) => setInput(e.target.value)}
                  onKeyDown={(e) => {
                    if (e.key === "Enter") handleSend();
                  }}
                />
                <button className="send-btn" onClick={() => handleSend()} disabled={loading}>
                  <Send size={14} /> Send
                </button>
              </div>
            </div>

            <aside className="ask-side">
              <button type="button" className="ask-side-new" onClick={handleNewChat} disabled={loading}>
                <MessageSquarePlus size={15} /> New chat
              </button>
              <p className="ask-side-label mono">Research questions</p>
              <div className="ask-side-qs">
                {RESEARCH_QUESTIONS.map((q) => (
                  <button
                    key={q}
                    type="button"
                    className="ask-side-q"
                    onClick={() => handleSend(q)}
                    disabled={loading}
                  >
                    {q}
                  </button>
                ))}
              </div>
            </aside>
          </div>
        )}

        {tab === "narrative" && (
          <div className="narrative-panel">
            <h2 className="narrative-heading display">Top Themes</h2>

            {topThemes.length > 0 ? (
              <div className="key-problems">
                {topThemes.map((p, i) => (
                  <div key={p.theme_id} className="problem-card">
                    <div className="problem-rank">{i + 1}</div>
                    <div className="problem-main">
                      <div className="problem-title-row">
                        <p className="problem-title">{noEmDash(p.title)}</p>
                      </div>
                      {p.connection ? (
                        <p className="problem-connection">{noEmDash(p.connection)}</p>
                      ) : null}
                      {(p.research_questions && p.research_questions.length) ? (
                        <div className="problem-tags">
                          {p.research_questions.map((q, qi) => (
                            <span key={qi} className="problem-tag">{q}</span>
                          ))}
                        </div>
                      ) : null}
                      <p className="problem-meta mono">{p.review_count.toLocaleString()} reviews · {p.share_pct}% of corpus{p.avg_rating != null ? " · avg rating " + p.avg_rating : ""}</p>
                      <div className="share-bar-track"><div className="share-bar-fill" style={{ width: (p.share_pct / maxShare) * 100 + "%" }} /></div>
                      {(p.representative_quotes && p.representative_quotes.length) ? (
                        <>
                          <button
                            type="button"
                            className="quotes-toggle"
                            onClick={() => setQuotesOpen((prev) => ({ ...prev, [p.theme_id]: !prev[p.theme_id] }))}
                            aria-expanded={!!quotesOpen[p.theme_id]}
                          >
                            {quotesOpen[p.theme_id] ? <ChevronUp /> : <ChevronDown />}
                            Supporting reviews
                          </button>
                          {quotesOpen[p.theme_id] ? (
                            <div className="problem-quotes">
                              {p.representative_quotes.map((q, qi) => (
                                <span key={qi} className="problem-quote">“{noEmDash(q)}”</span>
                              ))}
                            </div>
                          ) : null}
                        </>
                      ) : null}
                    </div>
                  </div>
                ))}
                {topThemes.length < 5 && nearMisses.length > 0 ? (
                  <div className="near-misses">
                    <p className="near-misses-title">Closest themes excluded - for inspection</p>
                    {nearMisses.map((m, mi) => (
                      <div key={mi} className="near-miss-row">
                        <span className="nm-label">{m.label || m.theme_id}</span>{" "}
                        · {m.review_count.toLocaleString()} reviews ({m.share_pct}%) · {m.reason}
                      </div>
                    ))}
                  </div>
                ) : null}
              </div>
            ) : (
              <div className="no-qualifying-themes">
                <strong>No theme meets the support threshold.</strong><br />
                No cluster covers at least 1% of reviews (or 15, whichever is higher), so nothing
                qualifies for the headline growth report. This should be rare given the corpus size -
                re-run <code>python -m src.theme_titles --refresh</code> after the pipeline stages complete.
                {nearMisses.length > 0 ? (
                  <div className="near-misses" style={{ marginTop: 14 }}>
                    <p className="near-misses-title">Closest themes excluded</p>
                    {nearMisses.map((m, mi) => (
                      <div key={mi} className="near-miss-row">
                        <span className="nm-label">{m.label || m.theme_id}</span>{" "}
                        · {m.review_count.toLocaleString()} reviews ({m.share_pct}%) · {m.reason}
                      </div>
                    ))}
                  </div>
                ) : null}
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

const root = createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
